name: NatApi

on:
  push:
    branches:
      - main
      - qa
  pull_request:
    branches:
      - main
      - qa

jobs:
  build:
    runs-on: windows-latest

    steps:
    # Checkout the repository
    - name: Checkout code
      uses: actions/checkout@v3

    # Setup .NET
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x

    # Restore dependencies
    - name: Restore dependencies
      run: dotnet restore

    # Compile the solution
    - name: Compile solution
      run: dotnet build --configuration Release --no-restore

    # Publish the project
    - name: Publish project
      run: dotnet publish Nat.API.csproj --configuration Release --output ./publish

     # Deploy to IIS using Web Deploy
    - name: Deploy to IIS
      run: |
        msdeploy.exe -verb:sync -source:contentPath="./publish" -dest:contentPath="Default Web Site/NatApi",computerName="https://<IIS_SERVER>/MSDeployAgentService",userName="<USERNAME>",password="<PASSWORD>",authType="Basic"
      env:
        MSDEPLOY_RETRY_ATTEMPTS: 3