<!DOCTYPEhtml>
<html>
<head>
  	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<style type='text/css'>
		@media only screen and (max-width: 556px) {
            .contenedor {
                text-align: center;
                font-family: Roboto;
                padding: 2rem;
                color: #425C69;
            }

            .tilde {
                width: 160px;
            }

            .titulo {
                font-size: 17px;
                font-weight: 400;
                line-height: 19.92px;
                margin: 1rem 0;
            }

            .subtitulo {
                font-size: 12px;
                font-weight: 400;
                line-height: 14.06px;
                margin: 1rem 0;
            }

            .texto {
                font-size: 16px;
                margin-bottom: 2rem;
            }

            .div-boton {
                margin: 1rem 0 2rem 0;
            }

            .validar {
                font-style: normal;
                font-weight: 700;
                font-size: 17px;
                line-height: 20px;
                font-family: Roboto;
                display: inline-block;
                background: #4BD000;
                border-radius: 10px;
                text-decoration: none;
                text-align: center;
                color: #FFFFFF !important;
                padding: 0.8rem 10rem;
                box-shadow: 0px 4px 12px rgba(0, 0, 0, 0.15);
            }
		}
